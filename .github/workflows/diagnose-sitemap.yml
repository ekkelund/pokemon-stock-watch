name: Diagnose Sitemap

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites adskilt af mellemrum (tom = de overvågede)'
        type: string
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 watcher/diagnose_sitemap.py ${{ inputs.sites }}
